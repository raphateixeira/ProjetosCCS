# ---------------------------------------------------------------------
#  Configuração do projeto Quarto — ProjetosCCS.
#  Notas e documentação dos projetos do Code Composer Studio (C2000):
#  projetos com a placa LAUNCHXL-F28379D.
#  ProjetosSK/ guarda só os projetos do CCS (workspace do CCS); o conteúdo (páginas, slides,
#  dados, análises) fica em Notas/.
# ---------------------------------------------------------------------

project:
  type: website
  output-dir: _site
  pre-render: scripts/empacota_projetos.py   # downloads/<Projeto>.zip de cada projeto do CCS
  resources:
    - downloads/*.zip
  render:
    - index.qmd
    - Notas/*.qmd
    - Notas/*/*.qmd

execute:
  freeze: auto

website:
  title: "Projetos CCS"
  description: "Projetos do Code Composer Studio com a LaunchPad C2000 LAUNCHXL-F28379D — Prof. Dr. Raphael Teixeira (UFPA-CAMTUC-FEE)"
  site-url: https://raphateixeira.github.io/ProjetosCCS/
  repo-url: https://github.com/raphateixeira/ProjetosCCS
  reader-mode: true
  navbar:
    background: "#FFFFFF"   # navbar branca (camada "Site" do TemaRTx.scss)
    foreground: "#0F1B33"
    title: "Projetos CCS"
    left:
      - text: "Início"
        href: https://raphateixeira.github.io/index.html
      - text: "Projetos CCS"
        href: index.qmd
    right:
      - text: "LaunchPad F28379D"
        href: Notas/Nota01LaunchPadF28379D.qmd
      - text: "Sallen-Key"
        menu:
          - text: "Nota do sistema"
          - text: "Planejamento dos Ensaios de Controle"
            href: Notas/ControleSallenKey/index.qmd
          - text: "---"
          - text: "Apresentações"
          - text: "Identificação do Filtro Sallen-Key"
            href: Notas/IdentificacaoSallenKeyPRBS/index.qmd
          - text: "Controle Proporcional"
            href: Notas/ControleProporcional/index.qmd
          - text: "Controle PI"
            href: Notas/ControlePI/index.qmd
          - text: "Controle Preditivo"
            href: Notas/ControlePreditivo/index.qmd
          - text: "---"
          - text: "Projetos do CCS"
            href: index.qmd#filtro-sallen-key
      - text: "Buck e inversor"
        href: https://raphateixeira.github.io/ConversoresPotencia/
      - text: "Motor-Gerador"
        href: index.qmd#motor-gerador
      - icon: github
        href: https://github.com/raphateixeira/ProjetosCCS
        aria-label: Repositório no GitHub
  page-footer:
    border: false
    center: "©2026 Prof. Dr. Raphael Teixeira — UFPA-CAMTUC-FEE"

format:
  html:
    theme: [cosmo, TemaRTx.scss]
    lang: pt-BR
    toc: true
    toc-depth: 3
    code-copy: true
    fig-align: center
